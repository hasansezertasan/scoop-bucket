---
name: Lint branch name
on:
  # pull_request_target is required so this check can post its sticky comment on
  # PRs from forks (a plain `pull_request` run gets a read-only token). It is
  # safe here: no PR code is checked out or executed, and the only untrusted
  # value (github.head_ref) is read through env, never interpolated into a shell.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  main:
    name: Validate branch name
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Lint branch name
        id: lint_branch_name
        env:
          # github.head_ref is the PR's source branch. Read it through env (not
          # inline ${{ }}) so an attacker-controlled fork branch name cannot be
          # injected into the shell — this is why pull_request_target is safe
          # here: the PR's code is never checked out or executed.
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          # Conventional Branch (https://conventional-branch.github.io/): a type
          # prefix followed by a short description. renovate/* is whitelisted so
          # dependency PRs are never blocked, and auto-update/* is the branch
          # the bucket's own bump workflows push.
          purpose='feature|feat|bugfix|fix|hotfix|release|chore'
          agents='ai|copilot|cursor|claude|codex'
          # Description: lowercase alphanumerics with single '-' or '.'
          # separators, never leading, trailing, or consecutive.
          desc='[a-z0-9]+([.-][a-z0-9]+)*'
          pattern="^(renovate/.+|auto-update/.+|(${purpose}|${agents})/${desc})$"
          if [[ "${BRANCH_NAME}" =~ ${pattern} ]]; then
            echo "Branch \"${BRANCH_NAME}\" follows the Conventional Branch format."
          else
            {
              echo "error_message=Branch \"${BRANCH_NAME}\" must follow the" \
                "Conventional Branch format \`<type>/<description>\`" \
                "(e.g. \`feature/add-login\`). Allowed types: ${purpose//|/, }" \
                "(and AI-agent prefixes: ${agents//|/, })."
            } >> "${GITHUB_OUTPUT}"
            exit 1
          fi
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        # The previous step fails on a bad branch name, which would stop the
        # workflow; this condition lets the comment step still run.
        if: always() && (steps.lint_branch_name.outputs.error_message != null)
        with:
          header: branch-name-lint-error
          message: |
            Hey there and thank you for opening this pull request! 👋🏼

            We require branch names to follow the [Conventional Branch](https://conventional-branch.github.io/) specification and it looks like your branch name needs to be adjusted.

            Details:

            ```
            ${{ steps.lint_branch_name.outputs.error_message }}
            ```
      # Delete the previous comment once the branch name is fixed.
      - if: ${{ steps.lint_branch_name.outputs.error_message == null }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: branch-name-lint-error
          delete: true
