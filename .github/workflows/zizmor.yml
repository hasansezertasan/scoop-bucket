---
name: zizmor
# Static security audit of this bucket's own workflows. The dispatch receivers
# act on attacker-controllable `client_payload` with a write token, so workflow
# hygiene (least-privilege permissions, no persisted credentials, no template
# injection) is load-bearing here. Findings go to the Security tab for triage;
# the job does not fail the build on them.
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write  # upload SARIF to the code-scanning dashboard
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b  # v0.8.0
