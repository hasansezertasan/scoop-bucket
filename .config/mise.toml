[tools]
action-validator = "latest"
actionlint = "latest"
yamlfmt = "latest"
yamllint = "latest"

[tasks."add-manifest"]
description = "Scaffold a manifest: `add-manifest binary <repo>` or `add-manifest shim <package>`"
run = "python3 scripts/add_manifest.py"

[tasks."style"]
description = "Format and lint all YAML files"
run = [{ task = "style:fix" }, { task = "style:check" }]

[tasks."style:fix"]
description = "Format YAML files in place"
run = "yamlfmt -conf .config/.yamlfmt.yml ."

[tasks."style:check"]
description = "Lint YAML and GitHub Actions files (no fixes)"
run = """
#!/usr/bin/env bash
set -e
echo "Running yamllint..."
yamllint -c .config/.yamllint.yaml .
echo "Running actionlint..."
actionlint
echo "Running action-validator..."
find .github/workflows -name '*.yml' -exec action-validator {} +
echo "All checks passed!"
"""
